<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="인천의 공공기록을 주제와 기관별로 살펴보는 아이아카이브">
<title>인천 아카이브 · iarchieve</title>
<link rel="stylesheet" href="./styles.css">
<script type="module" src="./archive.mjs"></script>
</head>
<body>
<header class="wrap"><a class="brand" href="./">iarchieve<span>.</span></a><nav aria-label="주 메뉴"><a href="#records">기록 탐색</a><a href="#sources">수집 출처</a></nav></header>
<main>
<section class="hero">
  <div class="wrap">
    <p class="region">대한민국 <span aria-hidden="true">/</span> 인천광역시</p>
    <h1>인천 아카이브</h1>
    <p class="intro">인천의 공공기록을 찾아보고, 발표와 결정이 남긴 원문을 읽어보세요.</p>
    <form id="search" role="search">
      <label for="query">인천 기록 검색</label>
      <div class="searchbar"><input id="query" type="search" maxlength="200" placeholder="예: 인천대로, 노후계획도시, 박물관"><button type="submit">검색</button></div>
    </form>
  </div>
</section>
<section id="records" class="wrap records">
  <div class="heading"><div><p class="eyebrow">PUBLIC RECORDS</p><h2>인천의 공개기록</h2></div><p id="status" role="status">기록을 불러오는 중입니다.</p></div>
  <div class="filters">
    <label>주제 <select id="topic"><option value="">전체 주제</option></select></label>
    <label>기관 <select id="publisher"><option value="">전체 기관</option></select></label>
    <label>연도 <select id="year"><option value="">전체 연도</option></select></label>
    <button id="reset" type="button" class="reset">초기화</button>
  </div>
  <ul id="results" class="results"></ul>
  <noscript>기록 검색과 필터를 사용하려면 JavaScript를 켜세요.</noscript>
</section>
<section id="sources" class="wrap sources">
  <p class="eyebrow">SOURCE DIRECTORY</p><h2>수집 출처</h2>
  <ul>
    <li><a href="https://www.incheon.go.kr/IC010205">인천광역시 보도자료</a></li>
    <li><a href="https://record.icouncil.go.kr/main.do">인천광역시의회 전자회의록·의안</a></li>
    <li><a href="https://data.incheon.go.kr/">인천데이터포털</a></li>
    <li><a href="https://www.incheon.go.kr/museum/MU010208">인천광역시립박물관 지난 전시</a></li>
  </ul>
</section>
</main>
<footer><div class="wrap"><strong>iarchieve.com</strong><span>인천 공개기록 초기 목록 · 원문은 발행기관에서 제공</span></div></footer>
</body>
</html>
